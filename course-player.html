<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Player - TheDeepVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        /* Inline CSS for Player */
        :root {
            --player-bg: #050505;
            --sidebar-bg: rgba(20, 20, 20, 0.85);
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.2);
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--player-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* No full page scroll */
            user-select: none; /* Anti-piracy */
        }

        .player-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            height: 70px;
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .course-title {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--gold);
            color: var(--gold);
        }

        .progress-container {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            position: absolute;
            top: 70px;
            left: 0;
            z-index: 11;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
            transition: width 0.3s linear;
        }

        .main-content {
            display: flex;
            flex: 1;
            height: calc(100vh - 73px);
            overflow: hidden;
        }

        .video-container {
            flex: 0 0 70%;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        #ytPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .sidebar {
            flex: 0 0 30%;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            background: var(--sidebar-bg);
            z-index: 5;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .chapters-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .chapter-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .chapter-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .chapter-item.active {
            background: rgba(212, 175, 55, 0.05);
            border-left: 3px solid var(--gold);
        }

        .chapter-item.active .chapter-title {
            color: var(--gold);
        }

        .chapter-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .chapter-item.active .chapter-icon {
            background: var(--gold-glow);
            color: var(--gold);
        }

        .chapter-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chapter-title {
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .chapter-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--player-bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--gold);
        }

        .spinner {
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            border-top: 3px solid var(--gold);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 992px) {
            .main-content {
                flex-direction: column;
                overflow-y: auto;
            }
            .video-container {
                flex: none;
                width: 100%;
            }
            .sidebar {
                flex: none;
                width: 100%;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                overflow-y: visible;
            }
            .course-title {
                display: none;
            }
        }
    </style>
</head>
<body oncontextmenu="return false">

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Authenticating & Loading Secure Player...</p>
    </div>

    <div class="player-layout">
        <!-- Top Bar -->
        <div class="top-bar">
            <a href="index.html" class="logo">TheDeepVerse</a>
            <div class="course-title" id="topCourseTitle">Loading Course...</div>
            <a href="dashboard.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Video Area -->
            <div class="video-container">
                <div class="video-wrapper">
                    <div id="ytPlayer"></div>
                </div>
            </div>

            <!-- Chapters Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3>Course Chapters</h3>
                </div>
                <ul class="chapters-list" id="chaptersList">
                    <!-- Chapters populated via JS -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/store-data.js"></script>
    
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let productData = null;
        let duration = 0;
        let progressInterval;
        let currentChapterIndex = -1;

        const products = typeof StoreEngine !== 'undefined' ? StoreEngine.getProducts() : [];

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        async function initPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                alert("No course specified.");
                window.location.href = 'store.html';
                return;
            }

            productData = products.find(p => p.id === productId);
            if (!productData || !productData.videoId) {
                alert("Course not found or has no video content.");
                window.location.href = 'store.html';
                return;
            }

            firebase.auth().onAuthStateChanged(async (user) => {
                if (!user) {
                    window.location.href = 'index.html';
                    return;
                }

                try {
                    const purchaseRef = window.FirebaseDatabase.ref(`users/${user.uid}/purchases/${productId}`);
                    const snapshot = await purchaseRef.once('value');
                    
                    if (!snapshot.exists() || snapshot.val() !== true) {
                        alert("Access Denied. You do not own this course.");
                        window.location.href = 'store.html';
                        return;
                    }

                    document.getElementById('loadingOverlay').style.display = 'none';
                    setupPage();
                    loadYouTubeVideo();
                } catch (error) {
                    console.error("Error verifying access:", error);
                    alert("Error verifying access.");
                    window.location.href = 'dashboard.html';
                }
            });
        }

        function setupPage() {
            document.getElementById('topCourseTitle').textContent = productData.name || 'Course Player';
            
            const listEl = document.getElementById('chaptersList');
            if (productData.chapters && productData.chapters.length > 0) {
                productData.chapters.forEach((ch, idx) => {
                    const li = document.createElement('li');
                    li.className = 'chapter-item';
                    li.id = `chapter-${idx}`;
                    li.onclick = () => seekToChapter(ch.time);

                    li.innerHTML = `
                        <div class="chapter-icon">
                            <i class="${ch.icon || 'fa-solid fa-play'}"></i>
                        </div>
                        <div class="chapter-info">
                            <span class="chapter-title">${ch.title}</span>
                            <span class="chapter-time">${formatTime(ch.time)}</span>
                        </div>
                    `;
                    listEl.appendChild(li);
                });
            } else {
                listEl.innerHTML = '<li class="chapter-item"><div class="chapter-info"><span class="chapter-title">No chapters available</span></div></li>';
            }
        }

        function loadYouTubeVideo() {
            if (typeof YT !== 'undefined' && YT.Player) {
                createPlayer();
            } else {
                window.onYouTubeIframeAPIReady = createPlayer;
            }
        }

        function createPlayer() {
            player = new YT.Player('ytPlayer', {
                videoId: productData.videoId,
                playerVars: {
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'fs': 1,
                    'playsinline': 1,
                    'controls': 1,
                    'disablekb': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            duration = player.getDuration();
            progressInterval = setInterval(updateProgress, 1000);
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                if (!progressInterval) {
                    progressInterval = setInterval(updateProgress, 1000);
                }
            } else {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function updateProgress() {
            if (!player || !player.getCurrentTime) return;
            
            const currentTime = player.getCurrentTime();
            if (duration > 0) {
                const perc = (currentTime / duration) * 100;
                document.getElementById('progressBar').style.width = perc + '%';
            }

            if (productData.chapters && productData.chapters.length > 0) {
                let activeIdx = -1;
                for (let i = 0; i < productData.chapters.length; i++) {
                    if (currentTime >= productData.chapters[i].time) {
                        activeIdx = i;
                    } else {
                        break;
                    }
                }

                if (activeIdx !== currentChapterIndex && activeIdx !== -1) {
                    if (currentChapterIndex !== -1) {
                        const oldActive = document.getElementById(`chapter-${currentChapterIndex}`);
                        if (oldActive) oldActive.classList.remove('active');
                    }
                    const newActive = document.getElementById(`chapter-${activeIdx}`);
                    if (newActive) {
                        newActive.classList.add('active');
                        currentChapterIndex = activeIdx;
                        newActive.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
        }

        function seekToChapter(timeSeconds) {
            if (player && player.seekTo) {
                player.seekTo(timeSeconds, true);
                player.playVideo();
            }
        }

        window.addEventListener('load', initPlayer);

    </script>
</body>
</html>
