<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Player - TheDeepVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        /* Inline CSS for Player */
        :root {
            --player-bg: #050505;
            --sidebar-bg: rgba(20, 20, 20, 0.85);
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.2);
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--player-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* No full page scroll */
            user-select: none; /* Anti-piracy */
        }

        .player-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            height: 70px;
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .course-title {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--gold);
            color: var(--gold);
        }

        .progress-container {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            position: absolute;
            top: 70px;
            left: 0;
            z-index: 11;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
            transition: width 0.3s linear;
        }

        .main-content {
            display: flex;
            flex: 1;
            height: calc(100vh - 73px);
            overflow: hidden;
        }

        .video-container {
            flex: 0 0 70%;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        #ytPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .sidebar {
            flex: 0 0 30%;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            background: var(--sidebar-bg);
            z-index: 5;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .chapters-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .chapter-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .chapter-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .chapter-item.active {
            background: rgba(212, 175, 55, 0.05);
            border-left: 3px solid var(--gold);
        }

        .chapter-item.active .chapter-title {
            color: var(--gold);
        }

        .chapter-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .chapter-item.active .chapter-icon {
            background: var(--gold-glow);
            color: var(--gold);
        }

        .chapter-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chapter-title {
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .chapter-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .chapter-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            opacity: 0.8;
            line-height: 1.4;
        }

        .module-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s ease;
            position: sticky;
            top: 0;
        }

        .module-header:hover {
            background: rgba(212, 175, 55, 0.06);
        }

        .module-toggle {
            color: var(--gold);
            font-size: 0.9rem;
            width: 16px;
            flex-shrink: 0;
        }

        .module-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: auto;
            white-space: nowrap;
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--player-bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--gold);
        }

        .spinner {
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            border-top: 3px solid var(--gold);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 992px) {
            .main-content {
                flex-direction: column;
                overflow-y: auto;
            }
            .video-container {
                flex: none;
                width: 100%;
            }
            .sidebar {
                flex: none;
                width: 100%;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                overflow-y: visible;
            }
            .course-title {
                display: none;
            }
        }
    </style>
</head>
<body oncontextmenu="return false">

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Authenticating & Loading Secure Player...</p>
    </div>

    <div class="player-layout">
        <!-- Top Bar -->
        <div class="top-bar">
            <a href="index.html" class="logo">TheDeepVerse</a>
            <div class="course-title" id="topCourseTitle">Loading Course...</div>
            <a href="dashboard.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Video Area -->
            <div class="video-container">
                <div class="video-wrapper">
                    <div id="ytPlayer"></div>
                </div>
            </div>

            <!-- Chapters Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3>Course Chapters</h3>
                </div>
                <ul class="chapters-list" id="chaptersList">
                    <!-- Chapters populated via JS -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/store-data.js"></script>
  <script src="js/user-system.js"></script>
    
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let productData = null;
        let productKey = null;
        let duration = 0;
        let progressTimer = null;
        let saveTimer = null;
        let currentLesson = null;
        let lessonStartTime = 0;
        let modules = [];
        let lessonIndex = [];   // flat published lessons: { moduleIndex, moduleTitle, ...lesson }
        let completedLessons = {};
        let currentUid = null;
        let progressLoaded = false;
        let pendingResumeTime = -1;   // -1 = no resume seek

        const US = window.UserSystem;

        function formatT(sec) { return US ? US.formatTimestamp(sec, false) : formatTime(sec); }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function parseDur(text) { return US ? US.parseTimestamp(text) : 0; }

        function lastSaved() {
            if (!currentUid || !productKey) return;
            US.saveProgress(currentUid, productKey, {
                lastLessonId: (currentLesson && currentLesson.id) || '',
                lastLessonTitle: (currentLesson && currentLesson.title) || '',
                lastTimestamp: player && player.getCurrentTime ? Math.floor(player.getCurrentTime()) : 0,
                completedLessons: completedLessons
            }).catch(function (e) { console.error('[progress] save failed', e); });
        }

        function buildLessonIndex() {
            lessonIndex = [];
            modules.forEach(function (m, mi) {
                (m.lessons || []).forEach(function (l) {
                    if (l.published === false) return;
                    lessonIndex.push({ moduleIndex: mi, moduleTitle: m.title, lesson: l });
                });
            });
        }

        async function initPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const resumeLesson = urlParams.get('lesson');
            const resumeTime = urlParams.get('t');

            if (!productId) {
                alert("No course specified.");
                window.location.href = 'store.html';
                return;
            }

            const products = typeof StoreEngine !== 'undefined' ? StoreEngine.getProducts() : [];
            productData = products.find(p => p.id === productId);
            if (!productData || !productData.videoId) {
                alert("Course not found or has no video content.");
                window.location.href = 'store.html';
                return;
            }
            productKey = productId;

            firebase.auth().onAuthStateChanged(async (user) => {
                if (!user) {
                    window.location.href = 'index.html';
                    return;
                }
                currentUid = user.uid;

                try {
                    const owned = await US.isPurchased(user.uid, productId);
                    if (!owned) {
                        alert("Access Denied. You do not own this course.");
                        window.location.href = 'store.html';
                        return;
                    }

                    modules = await US.getCurriculum(productData);
                    if (!modules || !modules.length) {
                        modules = US.seedCurriculum(productData);
                    }
                    buildLessonIndex();

                    const progress = await US.getProgress(user.uid, productId);
                    if (progress) {
                        completedLessons = progress.completedLessons || {};
                        if (!resumeLesson && !resumeTime && progress.lastLessonId) {
                            const target = lessonIndex.find(x => x.lesson.id === progress.lastLessonId);
                            if (target) {
                                document.getElementById('topCourseTitle').textContent =
                                    `Continue Learning: ${target.lesson.title}`;
                                pendingResumeTime = progress.lastTimestamp || 0;
                                setupPage(resumeLesson || progress.lastLessonId, progress.lastTimestamp || 0);
                                document.getElementById('loadingOverlay').style.display = 'none';
                                loadYouTubeVideo();
                                return;
                            }
                        }
                    }
                    progressLoaded = true;

                    document.getElementById('loadingOverlay').style.display = 'none';
                    setupPage(resumeLesson, resumeTime ? parseInt(resumeTime, 10) : 0);
                    loadYouTubeVideo();
                } catch (error) {
                    console.error("Error verifying access:", error);
                    alert("Error verifying access.");
                    window.location.href = 'dashboard.html';
                }
            });
        }

        function setupPage(resumeLessonId, resumeTimeSec) {
            document.getElementById('topCourseTitle').textContent = productData.title || productData.name || 'Course Player';

            const listEl = document.getElementById('chaptersList');
            listEl.innerHTML = '';

            if (!lessonIndex.length) {
                listEl.innerHTML = '<li class="chapter-item"><div class="chapter-info"><span class="chapter-title">Curriculum is being prepared. Please check back soon.</span></div></li>';
                return;
            }

            const groups = modules;

            groups.forEach((mod, mi) => {
                // Module header (accordion toggle)
                const head = document.createElement('div');
                head.className = 'module-header';
                head.id = `module-head-${mi}`;
                head.innerHTML = `
                    <span class="module-toggle">▸</span>
                    <span class="chapter-title">${(mod.title || 'Module ' + (mi + 1)).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</span>
                    <span class="module-meta">${(mod.lessons || []).length} lessons</span>
                `;
                head.addEventListener('click', () => toggleModule(mi));

                const body = document.createElement('div');
                body.className = 'module-body';
                body.id = `module-body-${mi}`;
                body.style.display = 'none';

                const ul = document.createElement('ul');
                ul.className = 'chapters-list';

                (mod.lessons || []).forEach((l) => {
                    if (l.published === false) return;
                    const li = document.createElement('li');
                    li.className = 'chapter-item';
                    li.dataset.lessonId = l.id;
                    li.onclick = () => playLesson(mi, l.id);

                    const done = completedLessons[l.id];
                    const icon = done ? 'fa-solid fa-circle-check' : (parseDur(l.duration) === 0 ? 'fa-solid fa-circle-play' : 'fa-solid fa-play');
                    const timeLabel = l.timeText || formatT(l.timestamp);
                    const durLabel = l.duration ? ` • ${l.duration}` : '';

                    li.innerHTML = `
                        <div class="chapter-icon">
                            <i class="${icon}"></i>
                        </div>
                        <div class="chapter-info">
                            <span class="chapter-title">${(l.title || 'Lesson').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</span>
                            <span class="chapter-time">${timeLabel}${durLabel}</span>
                            ${l.description ? `<span class="chapter-desc">${l.description.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</span>` : ''}
                        </div>
                    `;
                    ul.appendChild(li);
                });

                body.appendChild(ul);
                listEl.appendChild(head);
                listEl.appendChild(body);
            });

            // Auto-open first module, or open the module containing the resume lesson
            let openTarget = 0;
            if (resumeLessonId) {
                const stack = skillIndexFor(resumeLessonId);
                if (stack) openTarget = stack.moduleIndex;
            }
            toggleModule(openTarget, true);

            if (resumeLessonId) {
                const target = lessonIndex.find(x => x.lesson.id === resumeLessonId);
                if (target) {
                    // highlight
                    const all = listEl.querySelectorAll('.chapter-item');
                    all.forEach(el => { if (el.dataset.lessonId === resumeLessonId) el.classList.add('active'); });
                }
            }
        }

        function skillIndexFor(id) {
            return lessonIndex.find(x => x.lesson.id === id) || null;
        }

        function toggleModule(mi, forceOpen) {
            const body = document.getElementById(`module-body-${mi}`);
            const head = document.getElementById(`module-head-${mi}`);
            if (!body || !head) return;
            const willOpen = forceOpen !== undefined ? forceOpen : body.style.display === 'none';
            body.style.display = willOpen ? '' : 'none';
            const tri = head.querySelector('.module-toggle');
            if (tri) tri.textContent = willOpen ? '▾' : '▸';
        }

        function playLesson(mi, lessonId) {
            const entry = lessonIndex.find(x => x.lesson.id === lessonId);
            if (!entry) return;
            seekToLesson(entry.lesson);
            // highlight
            document.querySelectorAll('.chapter-item').forEach(el => el.classList.toggle('active', el.dataset.lessonId === lessonId));
            // ensure module open
            toggleModule(mi, true);
        }

        function loadYouTubeVideo() {
            if (typeof YT !== 'undefined' && YT.Player) {
                createPlayer();
            } else {
                window.onYouTubeIframeAPIReady = createPlayer;
            }
        }

        function createPlayer() {
            player = new YT.Player('ytPlayer', {
                videoId: productData.videoId,
                playerVars: {
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'fs': 1,
                    'playsinline': 1,
                    'controls': 1,
                    'disablekb': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function startTimers() {
            if (!progressTimer) progressTimer = setInterval(updateProgress, 2000);
            if (saveTimer) clearInterval(saveTimer);
            saveTimer = setInterval(lastSaved, 15000);
        }

        function onPlayerReady(event) {
            duration = player.getDuration();
            startTimers();
            const params = new URLSearchParams(window.location.search);
            const resumeTime = params.get('t');
            if (resumeTime) {
                pendingResumeTime = parseInt(resumeTime, 10) || 0;
            }
            if (pendingResumeTime >= 0) {
                player.seekTo(pendingResumeTime, true);
                player.playVideo();
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                startTimers();
            } else if (event.data === YT.PlayerState.PAUSED) {
                lastSaved();
            } else if (event.data === YT.PlayerState.ENDED) {
                lastSaved();
                clearInterval(progressTimer);
                progressTimer = null;
            }
        }

        function updateProgress() {
            if (!player || !player.getCurrentTime) return;
            const t = player.getCurrentTime();
            if (duration > 0) {
                document.getElementById('progressBar').style.width = ((t / duration) * 100) + '%';
            }

            // Determine the active lesson by timestamp
            let active = null;
            for (let i = 0; i < lessonIndex.length; i++) {
                if (t >= lessonIndex[i].lesson.timestamp) active = lessonIndex[i];
                else break;
            }
            if (active && active.lesson.timestamp > 0) {
                if (!currentLesson || currentLesson.id !== active.lesson.id) {
                    currentLesson = active.lesson;
                    lessonStartTime = t;
                    const all = document.querySelectorAll('.chapter-item');
                    all.forEach(el => el.classList.toggle('active', el.dataset.lessonId === active.lesson.id));
                }
                // Mark completed once watched past lesson's implied end (its duration, or 45s default)
                const durSec = parseDur(active.lesson.duration) || 45;
                if (t - lessonStartTime >= Math.min(durSec, 180) && !completedLessons[active.lesson.id]) {
                    completedLessons[active.lesson.id] = true;
                    const li = document.querySelector(`.chapter-item[data-lesson-id="${active.lesson.id}"] .chapter-icon i`);
                    if (li) li.className = 'fa-solid fa-circle-check';
                    lastSaved();
                }
            }
        }

        function seekToLesson(lesson) {
            if (!player || !player.seekTo) return;
            currentLesson = lesson;
            lessonStartTime = player.getCurrentTime();
            player.seekTo(lesson.timestamp, true);
            player.playVideo();
        }

        // Save on leaving the page or tab hidden
        window.addEventListener('beforeunload', function () { if (currentUid && productKey) lastSaved(); });
        document.addEventListener('visibilitychange', function () { if (document.hidden) lastSaved(); });

        window.addEventListener('load', initPlayer);

    </script>
</body>
</html>
